<main class="dashboard-page">
  <section class="dashboard-container">

    <header class="dashboard-header">

      <div class="dashboard-header__brand">
        <app-logo
          variant="full"
          size="medium">
        </app-logo>

        <div class="dashboard-header__text">
          <span>Ministério de Mídia</span>

          <h1>Área da Liderança</h1>

          <p>
            Bem-vindo(a), {{ usuario?.nome }}.
          </p>
        </div>
      </div>

      <app-portal-button
        variant="text"
        icon="logout"
        (buttonClick)="sair()">
        Sair
      </app-portal-button>

    </header>

    <section class="dashboard-content">

      <div class="dashboard-content__header">
        <h2>O que deseja gerenciar?</h2>

        <p>
          Selecione uma das opções abaixo para continuar.
        </p>
      </div>

      <div class="dashboard-options">

        <app-selection-card
          icon="calendar_month"
          title="Escala"
          subtitle="Gerencie datas, escalas, preenchimentos e disponibilidades"
          (cardClick)="selecionarOpcao('escala')">
        </app-selection-card>

        <app-selection-card
          icon="group"
          title="Cadastro de Integrantes"
          subtitle="Cadastre, edite e gerencie os integrantes do ministério"
          (cardClick)="selecionarOpcao('integrantes')">
        </app-selection-card>

        <app-selection-card
          icon="task_alt"
          title="Tarefas"
          subtitle="Acompanhe solicitações e gerencie as tarefas da equipe"
          (cardClick)="selecionarOpcao('tarefas')">
        </app-selection-card>

      </div>

    </section>

  </section>
</main>
