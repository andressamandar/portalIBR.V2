<mat-form-field
  class="portal-input"
  appearance="outline"
  subscriptSizing="dynamic"
>
  <mat-label>
    {{ label }}

    @if (required) {
      <span class="portal-input__required">*</span>
    }
  </mat-label>

  @if (icon) {
    <mat-icon matPrefix>
      {{ icon }}
    </mat-icon>
  }

  <input
    #inputElement
    matInput
    [type]="inputType"
    [value]="value"
    [placeholder]="placeholder"
    [required]="required"
    [readonly]="readonly"
    [disabled]="isDisabled"
    [autocomplete]="autocomplete"
    [attr.maxlength]="maxlength"
    [attr.minlength]="minlength"
    (input)="handleInput($any($event.target).value)"
    (click)="handleClick(inputElement)"
    (blur)="handleBlur()"
  />

  @if (loading) {
    <mat-spinner
      matSuffix
      diameter="20"
      class="portal-input__spinner"
    >
    </mat-spinner>
  } @else if (showPasswordToggle) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="portal-input__icon-button"
      [disabled]="isDisabled"
      [attr.aria-label]="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'"
      (click)="togglePasswordVisibility()"
    >
      <mat-icon>
        {{ passwordVisible ? 'visibility_off' : 'visibility' }}
      </mat-icon>
    </button>
  } @else if (suffixIcon) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="portal-input__icon-button"
      [disabled]="isDisabled"
      (click)="handleSuffixClick()"
    >
      <mat-icon>
        {{ suffixIcon }}
      </mat-icon>
    </button>
  }

  @if (errorMessage) {
    <mat-error>
      {{ errorMessage }}
    </mat-error>
  } @else if (hint) {
    <mat-hint>
      {{ hint }}
    </mat-hint>
  }
</mat-form-field>
